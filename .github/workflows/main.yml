name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ekstrak & Pindahkan File ke Root
      run: |
        sudo apt-get install -y unzip
        
        # Unzip file proyek jika ada file zip
        if [ -f MBG.zip ]; then
          unzip -o MBG.zip -d extracted_temp
          
          PROJECT_DIR=$(find extracted_temp -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          
          if [ -n "$PROJECT_DIR" ]; then
            echo "Folder proyek ditemukan di: $PROJECT_DIR"
            cp -rT "$PROJECT_DIR" .
          else
            cp -rT extracted_temp .
          fi
          
          rm -rf extracted_temp
        fi

        # Pastikan file .env.example dan .env selalu ada untuk Secrets Plugin
        if [ ! -f .env.example ]; then
          echo "# Placeholder .env.example" > .env.example
        fi

        if [ ! -f .env ]; then
          cp .env.example .env
        fi

        # Pastikan local.properties tersedia
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build with Gradle
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'

name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ekstrak & Rapikan Folder Project
      run: |
        sudo apt-get install -y unzip
        if [ -f MBG.zip ]; then
          unzip -o MBG.zip -d temp_extract
          # Pindahkan semua isi folder temp_extract ke direktori utama
          cp -rn temp_extract/*/* . 2>/dev/null || cp -rn temp_extract/* . 2>/dev/null || true
          rm -rf temp_extract
        fi

        # Pastikan file .env tersedia
        if [ -f .env.example ] && [ ! -f .env ]; then
          cp .env.example .env
        fi
        
        # Buat dummy local.properties agar Gradle tidak komplain
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build with Gradle
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
